site_name: "scikit-complexity"
site_description: "A Python package to create and simulate complex systems."
site_url: "https://georgedouzas.github.io/scikit-complexity"
repo_url: "https://github.com/georgedouzas/scikit-complexity"
repo_name: "georgedouzas/scikit-complexity"
site_dir: "site"
watch: [README.md, CONTRIBUTING.md, CHANGELOG.md, src/skcomplex]

theme:
  name: material
  features:
  - content.code.annotate
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  palette:
    primary: blue

nav:
  - Overview:
    - index.md
    - User guide:
      - overview/user_guide/index.md
      - Select a ready-made system: overview/user_guide/select_a_ready_made_system.md
      - Change it: overview/user_guide/change_it.md
      - System classes: overview/user_guide/system_classes.md
      - Build a custom system:
        - overview/user_guide/build_a_custom_system/index.md
        - Concepts: overview/user_guide/build_a_custom_system/concepts.md
        - Choosing compatible components: overview/user_guide/build_a_custom_system/choosing_compatible_components.md
        - Defining elements: overview/user_guide/build_a_custom_system/defining_elements.md
        - Kinds of dynamics: overview/user_guide/build_a_custom_system/kinds_of_dynamics.md
        - General interactions: overview/user_guide/build_a_custom_system/general_interactions.md
        - Connected components: overview/user_guide/build_a_custom_system/connected_components.md
        - Delays, events, drivers, and noise: overview/user_guide/build_a_custom_system/delays_events_drivers_and_noise.md
        - Stochastic maps: overview/user_guide/build_a_custom_system/stochastic_maps.md
        - Anomalous processes: overview/user_guide/build_a_custom_system/anomalous_processes.md
        - Geometry of chains: overview/user_guide/build_a_custom_system/geometry_of_chains.md
        - Groups of many elements: overview/user_guide/build_a_custom_system/groups_of_many_elements.md
        - Lattice systems: overview/user_guide/build_a_custom_system/lattice_systems.md
        - Networks: overview/user_guide/build_a_custom_system/networks.md
        - Fields: overview/user_guide/build_a_custom_system/fields.md
        - Phase-space fields: overview/user_guide/build_a_custom_system/phase_space_fields.md
        - Kinetic systems of active particles: overview/user_guide/build_a_custom_system/kinetic_systems_of_active_particles.md
        - Agent-based systems: overview/user_guide/build_a_custom_system/agent_based_systems.md
        - Cell complexes and link fields: overview/user_guide/build_a_custom_system/cell_complexes_and_link_fields.md
        - Rewriting systems: overview/user_guide/build_a_custom_system/rewriting_systems.md
        - Quantum systems: overview/user_guide/build_a_custom_system/quantum_systems.md
        - Stocks and flows: overview/user_guide/build_a_custom_system/stocks_and_flows.md
        - Linear programs: overview/user_guide/build_a_custom_system/linear_programs.md
        - Static systems: overview/user_guide/build_a_custom_system/static_systems.md
        - Constraints and search: overview/user_guide/build_a_custom_system/constraints_and_search.md
        - Control: overview/user_guide/build_a_custom_system/control.md
        - Learning by gradient steps: overview/user_guide/build_a_custom_system/learning_by_gradient_steps.md
      - Simulate: overview/user_guide/simulate.md
      - Observe: overview/user_guide/observe.md
      - Analyse: overview/user_guide/analyse.md
      - Run experiments: overview/user_guide/run_experiments.md
      - Extend the library: overview/user_guide/extend_the_library.md
    - Migrating from 0.6 to 0.7: overview/migration.md
    - Changelog: overview/changelog.md
    - License: overview/license.md
  - Parts:
    - Elements: parts/elements.md
    - Interactions: parts/interactions.md
    - Laws: parts/laws.md
    - Systems: parts/systems.md
    - Solvers: parts/solvers.md
    - Backends: parts/backends.md
    - Analyses: parts/analyses.md
    - Experiments: parts/experiments.md
  - Systems: systems/
  - API: api/
  - Examples:
    - Physics: generated/gallery/physics
    - Chemistry: generated/gallery/chemistry
    - Biology: generated/gallery/biology
    - Economics: generated/gallery/economics
    - Social: generated/gallery/social
    - Engineering: generated/gallery/engineering
    - Mathematics: generated/gallery/mathematics
    - Computer science: generated/gallery/computer_science
  - Development:
    - development/index.md
    - Contributing: development/contributing.md
    - Code of Conduct: development/code_of_conduct.md

exclude_docs: |
  gallery_tools/
  gallery_hooks.py
  generated/gallery/_cache/

hooks:
  - docs/gallery_hooks.py

extra_javascript:
  - js/rerun_embed.js

extra_css:
  - css/style.css
  - css/material.css
  - css/mkdocstrings.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - callouts
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.magiclink
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      relaxed_headers: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

plugins:
  - search
  - autorefs
  - gallery:
      conf_script: docs/gallery_conf.py
      examples_dirs:
        - docs/examples/physics
        - docs/examples/chemistry
        - docs/examples/biology
        - docs/examples/economics
        - docs/examples/social
        - docs/examples/engineering
        - docs/examples/mathematics
        - docs/examples/computer_science
      gallery_dirs:
        - docs/generated/gallery/physics
        - docs/generated/gallery/chemistry
        - docs/generated/gallery/biology
        - docs/generated/gallery/economics
        - docs/generated/gallery/social
        - docs/generated/gallery/engineering
        - docs/generated/gallery/mathematics
        - docs/generated/gallery/computer_science
  - markdown-exec
  - gen-files:
      scripts:
      - docs/generate_api.py
      - docs/generate_systems.py
      - docs/generate_parts.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: yes
              warn_unknown_params: no
              warn_missing_types: no
            merge_init_into_class: yes
            show_submodules: no

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/georgedouzas
