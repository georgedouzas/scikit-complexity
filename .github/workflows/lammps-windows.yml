name: LAMMPS on Windows

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lammps:

    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the package
      run: python -m pip install .

    - name: Start a LAMMPS instance
      run: python -c "from lammps import lammps; print(lammps(cmdargs=['-screen', 'none', '-log', 'none']).version())"
