name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:

  ci:

    uses: ./.github/workflows/ci.yml

  build:

    needs: ci

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        cache: true
        cache-dependency-path: pyproject.toml

    - name: Build distribution
      run: pdm build

    - name: Upload distribution artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  github-release:

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true

  pypi-release:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/scikit-complexity

    permissions:
      id-token: write

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  docs-release:

    needs: ci

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: '3.13'
        cache: true
        cache-dependency-path: pyproject.toml

    - name: Install software rendering
      run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb

    - name: Install dependencies
      run: pdm install -dG maintenance -dG docs -dG gallery -G structures -G rna -G metabolism

    - name: Deploy the documentation
      env:
        PYTHONPATH: docs
        WGPU_BACKEND: vulkan
        SKCOMPLEX_GALLERY_MAX_SECONDS: '600'
        PYTHONWARNINGS: "ignore:warning_filter doesn't do anything:DeprecationWarning"
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        pdm run python -m gallery_tools run
        pdm run properdocs gh-deploy --strict --force
