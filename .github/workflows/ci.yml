name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:

  checks:

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python versions
      uses: actions/setup-python@v5
      with:
        python-version: |
            3.12
            3.13

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        cache: true
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: pdm install --no-default -dG maintenance -dG checks

    - name: Check code quality
      run: pdm checks quality

    - name: Check type annotations
      run: pdm checks types

    - name: Check vulnerabilities in dependencies
      run: pdm checks dependencies

    - name: Check security issues
      run: pdm checks security

    - name: Check docstring coverage
      run: pdm checks docs

  tests:

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python versions
      uses: actions/setup-python@v5
      with:
        python-version: |
            3.12
            3.13

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        cache: true
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: pdm install -dG maintenance -dG tests

    - name: Run the test suite
      run: pdm tests

  doc:

    if: ${{ github.ref != 'refs/heads/main' }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        cache: true
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: pdm install -dG maintenance -dG docs

    - name: Build documentation with Python ${{ matrix.python-version }}
      run: pdm docs build

  gallery:

    if: ${{ github.ref != 'refs/heads/main' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        backend: ['native', 'web']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: '3.13'
        cache: true
        cache-dependency-path: pyproject.toml

    - name: Install software rendering
      run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb

    - name: Install dependencies
      run: pdm install -dG maintenance -dG docs -dG gallery

    - name: Install Chromium
      if: ${{ matrix.backend == 'web' }}
      run: pdm run python -m playwright install --with-deps chromium

    - name: Restore the screenshot cache
      uses: actions/cache@v4
      with:
        path: docs/generated/gallery
        key: gallery-${{ matrix.backend }}-${{ hashFiles('docs/examples/**', 'src/skcomplex/models/**', 'pdm.lock') }}
        restore-keys: gallery-${{ matrix.backend }}-

    - name: Build the gallery with the ${{ matrix.backend }} backend
      env:
        WGPU_BACKEND: vulkan
        SKCOMPLEX_GALLERY_CAPTURE: '1'
      run: pdm run nox --error-on-external-run -R -s gallery -- --backend ${{ matrix.backend }} --curated
