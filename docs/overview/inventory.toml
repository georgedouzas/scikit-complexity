conserved-noise = { description = "Noise that conserves a field, the divergence of a random flux on lattice links" }
fractional-derivatives = { description = "States of fractional order whose rate laws give Caputo derivatives, with memory solvers" }
group-spaces = { description = "Cayley graphs of finitely presented, automaton, permutation, and matrix groups as spaces" }
