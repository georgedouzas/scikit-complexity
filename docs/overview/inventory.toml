markets = { description = "Markets and order books that clear agent orders" }
stocks-and-flows = { description = "Stocks, flows, conserved quantities, and system-dynamics delays" }
rewriting = { description = "Rewriting systems of words, graphs, and tilings" }
quantum = { description = "Quantum systems with unitary, Lindblad, and trajectory dynamics" }
acausal-components = { description = "Components connected through ports with potential and flow variables", change = "add-acausal-components" }
network-generators = { description = "Network generators and states on edges of adaptive networks" }
constraint-networks = { description = "Stoichiometric constraint networks solved as linear programmes", change = "add-constraint-based-models" }
