# Inventory of the models surveyed from the reference books and articles.
#
# Every model is a table under its field path, keyed by the name it registers under. The status is one of
# `implemented`, `pending <change>`, `blocked <change>` with the missing `feature`, or `out of scope` with the
# `reason` and a `library` a future change could wrap. Sources are keys of the `sources` table with a section, or
# arXiv identifiers with a section. The inventory check in tests/models/test_inventory.py compares it with the
# catalog and the OpenSpec changes.

