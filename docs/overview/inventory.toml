power-series-states = { description = "States valued in rings of formal power series truncated at an order, held by their coefficients", change = "extend-group-automata" }
distribution-states = { description = "States that are distributions over activity grids, with encounter laws" }
learning = { description = "Parameters that evolve by optimising a loss of an inner system", change = "add-learning-dynamics" }
link-fields = { description = "States on links and plaquettes of cell complexes", change = "add-link-fields" }
matrix-groups = { description = "States valued in compact matrix groups, sampled by class functions of holonomies along cell paths", change = "add-non-abelian-gauge-fields" }
label-copies = { description = "Monte Carlo copies of the label of a neighbouring site, scored by contacts between labelled regions and constraints on their volumes and surfaces", change = "add-label-copy-sampling" }
molecular-structures = { description = "Sequences and chains with internal coordinates", change = "add-molecular-structures" }
nonlocal-operators = { description = "Convolutions, shifted reads, and operator inversions on fields", change = "add-nonlocal-operators" }
optimal-control = { description = "Control inputs with costs solved by Pontryagin or direct transcription" }
phase-space-fields = { description = "Fields over position and velocity or orientation", change = "add-phase-space-fields" }
integral-operators = { description = "Integrals of fields against two-point kernels and cumulative integrals along an axis", change = "add-integral-field-operators" }
simplex-domains = { description = "Fields over the simplex of frequencies, with partial cells along its slanted face", change = "add-integral-field-operators" }
static-solutions = { description = "Systems solved, swept, or optimised rather than integrated in time", change = "add-static-models" }
satisfiability = { description = "Constraints on Boolean states decided incrementally", change = "add-static-models" }
population-search = { description = "Populations of candidates moved on an objective, one generation per step", change = "add-static-models" }
tensor-fields = { description = "Tensor-valued states with declared symmetries", change = "add-tensor-fields" }
variational-mechanics = { description = "Hamiltonian and Lagrangian mechanics with derived equations", change = "add-variational-mechanics" }
region-layers = { description = "Three-dimensional continuous agent spaces and region layers of polygons", change = "extend-agent-spaces" }
hypergraphs = { description = "Hypergraph spaces, k-body interactions, regulatory hyperedges, and coupling tensors", change = "add-higher-order-interactions" }
curved-spacetimes = { description = "Pseudo-Riemannian spaces with symbolic metrics, geodesics, and Einstein equations reduced by symmetry", change = "add-general-relativity" }
learned-surrogates = { description = "Surrogate systems fitted to trajectories by mode decomposition, sparse regression, or reservoirs" }
hyperbolic-networks = { description = "Hyperbolic and popularity-similarity networks and their renormalization", change = "add-multiscale-networks" }
member-sets = { description = "Variable agent groups placed on network nodes, read by neighbours as sets per node that grow", change = "extend-network-dynamics" }
hyperedge-requests = { description = "Hyperedges of every size up to a rank, added and removed by topology requests during a run", change = "extend-network-dynamics" }
path-reductions = { description = "Shortest-path quantities, such as the betweenness, recomputed on the current topology", change = "extend-network-dynamics" }

[vocabulary.time]
continuous = "Continuous time: rates, noise, implicit equations, generators, jumps, and events"
discrete = "Discrete time with a synchronous, random-sequential, or phased schedule"
static = "No time: constraints and objectives solved once"

[vocabulary.space]
none = "Well-mixed, with no substrate"
lattice = "Regular cells with ordered neighbourhoods"
network = "Nodes, edges, and optional hyperedges"
continuous = "Positions in a continuous space with boundary conditions"
mesh = "Cells and faces of finite volumes"

[vocabulary.components]
element = "One entity with states, parameters, and intrinsic laws"
group = "Identical members of one element type held as arrays"
variable-group = "A group whose members laws add and remove"
site-group = "A group with one member per site of the space"
edge-group = "A group with one member per edge of a network space"
hyperedge-group = "A group with one member per hyperedge of a network space"
system = "A nested system"

[vocabulary.bindings]
members = "Roles bound to components or members"
pairs = "Laws run once per pair of members"
neighbors = "Laws run once per pair of adjacent members in the space"
hyperedges = "Laws run once per hyperedge of the space"

[vocabulary.laws]
rate = { class = "continuous", description = "Rate of change of a state, of any order" }
noise = { class = "continuous", description = "Noise of a stochastic equation, with its convention" }
equation = { class = "continuous", description = "Implicit or algebraic relation between derivatives and states" }
generator = { class = "continuous", description = "Generator of unitary dynamics on a Hilbert domain" }
dissipator = { class = "continuous", description = "Lindblad dissipator on a Hilbert domain" }
jump = { class = "event", description = "Increment at a random time drawn from a clock" }
event = { class = "event", description = "Reset when a guard crosses zero" }
update = { class = "discrete", description = "Next value of a state, possibly of selected members" }
transition = { class = "discrete", description = "Markov transition between categorical values" }
rule = { class = "discrete", description = "Imperative behaviour of the members of a group" }
local-rule = { class = "discrete", description = "Update of a site from its neighbourhood pattern" }
rewrite = { class = "discrete", description = "Productions applied in parallel to a structured state" }
sample = { class = "discrete", description = "Move proposed and accepted by an energy" }
match = { class = "discrete", description = "Pairing of the members of one or two groups" }
transfer = { class = "any", description = "Quantity moved from a source state to a sink state" }
boundary = { class = "constraint", description = "Constraint applied to states after each step" }
objective = { class = "constraint", description = "Quantity minimised by a static solution or a control" }
linear-program = { class = "constraint", description = "Optimal solution of a linear program that sets algebraic states" }
encounter = { class = "continuous", description = "Encounter of active particles that moves, creates, or removes them over an activity grid" }

[vocabulary.domains]
real = "Real numbers, possibly bounded"
integer = "Integers, possibly nonnegative"
boolean = "Truth values"
categorical = "One of a finite set of labels"
angle = "Angles wrapped into one turn"
complex = "Complex numbers"
vector = "Vectors of the space's dimension"
matrix = "Matrices of a compact group, such as SU(N), held by their real components"
tensor = "Tensors of declared rank and symmetry over the space's dimension"
hilbert = "Vectors and operators of a Hilbert space of declared dimension"
sequence = "Sequences over an alphabet"
series = "Formal power series truncated at an order, held by their coefficients"
graph = "Graphs"
tiling = "Tilings of prototiles"

