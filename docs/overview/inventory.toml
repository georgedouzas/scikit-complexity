# Inventory of the systems surveyed from the reference books and articles.
#
# Every system is a table under its field path, keyed by the name it registers under. The status is one of
# `implemented`, `pending <change>`, or `blocked <change>` with the missing `feature`; no system is out of scope.
# Sources are keys of the `sources` table with a section, or arXiv identifiers with a section.
#
# Systems exist first to exercise the core. Every entry lists the core primitives it exercises, from the `primitives`
# vocabulary, whose entries name the change that adds them when the core does not have them yet. Its priority is `core`
# when it exercises a primitive or a combination of primitives that no earlier implemented entry exercises, or needs a
# missing one, and `example` when it repeats a covered pattern. Changes implement `core` entries first.
#
# Every entry also maps to the system vocabulary of the `vocabulary` tables: its time, space, components, interaction
# bindings, laws, and state domains, as `system`. The tags of implemented entries come from the compiled systems.
#
# The inventory check in docs/inventory_checks.py, which the documentation build runs, compares it with the catalog,
# the vocabulary, and the OpenSpec changes.

[primitives]
rates = { description = "Rate laws of ordinary differential equations" }
equations = { description = "Equation laws with derivatives, such as second-order equations of motion" }
noise = { description = "Noise laws of stochastic differential equations" }
fractional-noise = { description = "Fractional Gaussian noise with long-range correlations" }
jumps = { description = "Jump laws of continuous-time Markov processes, run by Gillespie" }
updates = { description = "Update laws of discrete-time maps" }
transitions = { description = "Transition matrices of discrete Markov chains" }
renewals = { description = "Renewal laws with non-exponential waiting times" }
events = { description = "Events with guards and resets in hybrid systems" }
delays = { description = "Delayed and lagged reads of states" }
time-inputs = { description = "Time-dependent inputs, such as steps, pulses, ramps, and series" }
switches = { description = "Laws that switch on conditions of the state" }
boundaries = { description = "Boundary laws and constrained domains of states" }
discrete-states = { description = "Integer, Boolean, and categorical states" }
angles = { description = "Angle states wrapped onto the circle" }
complex-states = { description = "Complex-valued states" }
draws = { description = "Random draws inside laws" }
numeric-functions = { description = "Numeric functions and lookup tables called from laws" }
groups = { description = "Groups of identical members with vectorised laws" }
interactions = { description = "Interactions between components through roles" }
reductions = { description = "Reductions over groups, such as totals, means, and counts" }
member-offsets = { description = "Reads and jumps at offsets of group members" }
observables = { description = "Declared observables of systems" }
co-simulation = { description = "Coupled modules with their own solvers" }
lattices = { description = "Lattice spaces with neighbourhoods" }
local-rules = { description = "Local rules of cellular automata, including totalistic and Wolfram rules" }
extremal-updates = { description = "Updates of the extremal site and its neighbours" }
monte-carlo = { description = "Monte Carlo sampling with energies, moves, and samplers" }
fields = { description = "Spatial fields with differential operators on lattices and meshes" }
finite-volumes = { description = "Conservation laws of fields as fluxes through finite volumes" }
particles = { description = "Particles with pair potentials in periodic or reflecting boxes" }
potentials = { description = "Potentials, springs, gravity, and drag between bodies" }
networks = { description = "Network spaces and adjacency between components" }
continuous-spaces = { description = "Continuous and Euclidean spaces" }
agents = { description = "Agent populations with rules" }
